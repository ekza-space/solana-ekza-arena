[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_ekza_arena = "D3a99Wj3eLLn4jbXU5rLDbaFT6giQiUbmcPkiyQSM8iZ"
arena_leaderboard = "9A5PkCQrsp98SNBfVRiRs5zVdnzxVdRZQFy2ZDDGjaeU"
solana_stellar = "3rVXfq7LLSLqbDzvZuSrQoMytwczLj2Q8Hue62rxPZAA"

# Default gossip port 8000 is commonly taken by dev servers; keep the
# ephemeral test validator off it.
[test.validator]
bind_address = "127.0.0.1"
gossip_port = 8998

[[test.genesis]]
address = "3rVXfq7LLSLqbDzvZuSrQoMytwczLj2Q8Hue62rxPZAA"
program = "../solana-stellar/target/deploy/solana_stellar.so"

# Metaplex Token Metadata — needed for the v3 NFT mint CPI (spec §11). Dumped
# from devnet and vendored into the repo so tests are machine-independent; the
# shared localnet clones the same program id.
[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/token_metadata.so"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
